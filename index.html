function Section({ id, title, kicker, children }) {
  return (
    <section id={id} style={{ scrollMarginTop: 90, marginBottom: 56 }}>
      {kicker && (
        <div style={{ fontFamily: "Inter", fontSize: 11, letterSpacing: 3, color: "#D9A755", textTransform: "uppercase", marginBottom: 6 }}>
          {kicker}
        </div>
      )}
      <h2 style={{ fontFamily: "Fraunces", fontWeight: 500, fontSize: 26, margin: "0 0 18px", letterSpacing: -0.3 }}>{title}</h2>
      {children}
    </section>
  );
}

function Card({ children, accent = "#2E2415", style }) {
  return (
    <div style={{ background: "#1A140D", border: `1px solid ${accent}`, borderRadius: 14, padding: "18px 20px", ...style }}>
      {children}
    </div>
  );
}

function Pill({ children, color = "#D9A755" }) {
  return (
    <span
      style={{
        display: "inline-block",
        fontFamily: "JetBrains Mono",
        fontSize: 11,
        fontWeight: 700,
        padding: "3px 9px",

        marginRight: 6,
        marginBottom: 6,

}

function Table({ head, rows }) {
  return (
    <div style={{ background: "#1A140D", border: "1px solid #2E2415", borderRadius: 14, overflow: "auto" }}>
      <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 520 }}>
        <thead>
          <tr style={{ borderBottom: "1px solid #2E2415" }}>
            {head.map((h) => (
              <th
                key={h}
                style={{
                  textAlign: "left",
                  padding: "10px 14px",
                  fontFamily: "Inter",
                  fontSize: 10.5,
                  letterSpacing: 1,
                  textTransform: "uppercase",
                  color: "#8a8064",
                  whiteSpace: "nowrap",
                }}
              >
                {h}
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {rows.map((r, i) => (
            <tr key={i} style={{ borderBottom: "1px solid #241C10" }}>
              {r.map((c, j) => (
                <td
                  key={j}
                  style={{
                    padding: "10px 14px",
                    fontFamily: j === 0 || j === 4 || j === 5 ? "JetBrains Mono" : "Inter",
                    fontSize: 12.5,
                    color: j === 0 ? "#A69B85" : j === 6 ? "#D9A755" : "#c9c5b5",
                    whiteSpace: "nowrap",
                  }}
                >
                  {c || "—"}
                </td>
              ))}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}
